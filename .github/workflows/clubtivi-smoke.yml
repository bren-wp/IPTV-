name: IPTV+ unified Flutter branding and dependency checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:
concurrency:
  group: iptv-clubtivi-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  branding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run tauri -- icon assets/brand/iptv-plus-icon.svg
      - name: Apply one IPTV+ full-featured brand and check package configuration
        run: |
          python3 tools/clubtivi/prepare.py --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version 0.2.0
          python3 - <<'PY'
          from pathlib import Path
          root=Path('vendor/clubTivi')
          gradle=(root/'android/app/build.gradle.kts').read_text()
          flutter=(root/'lib/main.dart').read_text()
          app=(root/'lib/app/app.dart').read_text()
          updates=(root/'lib/data/services/app_update_service.dart').read_text()
          pub=(root/'pubspec.yaml').read_text()
          assert 'Apache License' in (root/'LICENSE').read_text()
          assert 'com.brendigo.iptvplus"' in gradle
          assert 'com.brendigo.iptvplus.free' not in gradle
          assert 'FeatureGate.setTier(AppTier.pro)' in flutter
          assert "title: iptvPlusTitle" in app
          assert 'releases?per_page=10' in updates
          assert 'apkDownloadUrl: null' in updates
          assert 'downloadAndInstall' not in updates
          assert "isIptvPlusPro" not in updates
          assert 'REQUEST_INSTALL_PACKAGES' not in (root/'android/app/src/main/AndroidManifest.xml').read_text()
          for constraint in ('dio: ^5.11.1', 'drift: ^2.35.4', 'shared_preferences: ^2.5.6', 'media_kit: ^1.2.6', 'go_router: ^18.1.4'):
            assert constraint in pub, constraint
          assert 'drift_dev:' not in pub
          assert 'riverpod_generator:' not in pub
          providers=(root/'lib/features/providers/providers_screen.dart').read_text()
          assert '_IptvPlusCatalogGroup' in providers
          assert 'Regije i kategorije programa' in providers
          assert 'iptvplus-country-hr' in providers
          assert 'iptvplus-country-si' in providers
          assert 'iptvplus-country-ba' in providers
          assert 'iptvplus-country-rs' in providers
          assert 'iptvplus-category-sports' in providers
          assert 'iptvplus-category-animation' in providers
          print('Unified identity, region and genre chooser, Pro gate, dependency and source security OK')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Upgrade compatible Flutter Pub dependencies
        working-directory: vendor/clubTivi
        run: flutter pub upgrade
      - name: Analyze Flutter API after dependency updates
        working-directory: vendor/clubTivi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run complete unit and widget tests
        working-directory: vendor/clubTivi
        run: flutter test --no-pub
