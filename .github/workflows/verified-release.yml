name: IPTV+ verified unified release (APK AAB Portable Setup)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Expected version matching package.json
        required: false
        type: string
concurrency:
  group: iptv-plus-unified-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new app version and absence of existing GitHub Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/check_version.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: python3 scripts/release/validate_designs.py
      - run: python3 -m unittest discover scripts/release -p 'test_*.py'

  windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Brand the complete Flutter engine
        shell: pwsh
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          if ($LASTEXITCODE -ne 0) { throw "IPTV+ icon generation failed" }
          python tools/clubtivi/prepare.py --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "IPTV+ branding failed" }
      - name: Upgrade to latest compatible Pub dependencies and run tests
        working-directory: vendor/clubTivi
        shell: pwsh
        run: |
          flutter pub upgrade
          if ($LASTEXITCODE -ne 0) { throw "Dependency resolution failed" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Native Windows build failed" }
      - name: Package Windows standalone Portable and NSIS Setup
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'vendor/clubTivi/build/windows/x64/runner/Release'
          if (!(Test-Path "$payload/iptvplus.exe") -or !(Test-Path "$payload/data")) { throw "Flutter runner incomplete" }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$payload/*" -DestinationPath tools/portable/flutter-bundle.zip -CompressionLevel Optimal -Force
          dotnet publish tools/portable/IPTVPlusPortable.csproj -c Release -r win-x64 --self-contained true -o portable-output -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0 -or !(Test-Path portable-output/IPTVPlusPortable.exe)) { throw "Portable packaging failed" }
          Copy-Item portable-output/IPTVPlusPortable.exe "release/IPTV-Plus-v$($env:RELEASE_VERSION)-Portable.exe"
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS missing" }
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $compiler)) { throw "NSIS compiler absent" }
          $output = Join-Path $PWD "release/IPTV-Plus-v$($env:RELEASE_VERSION)-Setup.exe"
          & $compiler "/DVERSION=$($env:RELEASE_VERSION)" "/DPAYLOAD=$payload" "/DOUTPUT=$output" tools/windows/iptvplus.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) { throw "Setup creation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-windows
          path: release/*.exe
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Prepare single unsigned Android app
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          python3 tools/clubtivi/prepare.py --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version "$RELEASE_VERSION"
      - name: Upgrade compatible Pub packages and compile APK and AAB
        working-directory: vendor/clubTivi
        run: |
          flutter pub upgrade
          flutter test
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify both Android artifacts are UNSIGNED (not installable)
        run: |
          mkdir -p release
          apk=vendor/clubTivi/build/app/outputs/flutter-apk/app-release.apk
          aab=vendor/clubTivi/build/app/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          if "$signer" verify --verbose "$apk"; then
            echo "::error::Android APK is signed unexpectedly; this pipeline produces UNSIGNED developer artifacts only"
            exit 1
          fi
          python3 - "$apk" "$aab" <<'PY'
          import sys, zipfile
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  required = ("AndroidManifest.xml" if path.endswith(".apk")
                              else "base/manifest/AndroidManifest.xml")
                  assert required in names, f"Android manifest missing: {path}"
                  if path.endswith(".aab"):
                      assert not any(n.startswith("META-INF/") and n.upper().endswith((".RSA", ".DSA", ".EC", ".SF"))
                                     for n in names), "AAB appears JAR-signed"
          print("Unsigned Android packages generated (not installable / not Play-ready)")
          PY
          cp "$apk" "release/IPTV-Plus-v$RELEASE_VERSION-Unsigned.apk"
          cp "$aab" "release/IPTV-Plus-v$RELEASE_VERSION-Unsigned.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android
          path: |
            release/*.apk
            release/*.aab
          if-no-files-found: error

  publish:
    needs: [preflight, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iptv-*
          path: release
          merge-multiple: true
      - name: Validate exactly four platform packages and include full branding
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/release/validate_designs.py
          zip -q -r "release/IPTV-Plus-v$RELEASE_VERSION-Branding.zip" assets/brand assets/previews assets/screens
          python3 scripts/release/notes.py "$RELEASE_VERSION"
          python3 scripts/release/validate_artifacts.py --directory release --version "$RELEASE_VERSION"
      - name: Publish four-file UNSIGNED Android development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" release/* --prerelease --target "$GITHUB_SHA" \
            --title "IPTV+ $TAG — UNSIGNED Android development and Windows builds" \
            --notes-file release/RELEASE-NOTES.md
