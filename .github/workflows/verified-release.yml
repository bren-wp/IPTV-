name: IPTV+ verified release — Free and Pro, Android and Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Expected app version (must match package.json)
        required: false
        type: string
concurrency:
  group: iptv-plus-release
  cancel-in-progress: false
jobs:
  signing-readiness:
    name: Android signing prerequisites (no key material exposed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Free/Pro signing secrets before native builds
        id: check
        env:
          IPTV_FREE_KEYSTORE_BASE64: ${{ secrets.IPTV_FREE_KEYSTORE_BASE64 }}
          IPTV_FREE_STORE_PASSWORD: ${{ secrets.IPTV_FREE_STORE_PASSWORD }}
          IPTV_FREE_KEY_PASSWORD: ${{ secrets.IPTV_FREE_KEY_PASSWORD }}
          IPTV_FREE_KEY_ALIAS: ${{ secrets.IPTV_FREE_KEY_ALIAS }}
          IPTV_PRO_KEYSTORE_BASE64: ${{ secrets.IPTV_PRO_KEYSTORE_BASE64 }}
          IPTV_PRO_STORE_PASSWORD: ${{ secrets.IPTV_PRO_STORE_PASSWORD }}
          IPTV_PRO_KEY_PASSWORD: ${{ secrets.IPTV_PRO_KEY_PASSWORD }}
          IPTV_PRO_KEY_ALIAS: ${{ secrets.IPTV_PRO_KEY_ALIAS }}
        run: python3 scripts/release/check_signing_env.py
  preflight:
    needs: signing-readiness
    if: needs.signing-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New unique version check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/check_version.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: python3 scripts/release/validate_designs.py

  windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Pro]
    env:
      EDITION: ${{ matrix.edition }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Apply IPTV+ brand to clubTivi Flutter engine
        shell: pwsh
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          if ($LASTEXITCODE -ne 0) { throw "IPTV+ icon generation failed" }
          python tools/clubtivi/prepare.py --edition $(($env:EDITION).ToLowerInvariant()) --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version $env:RELEASE_VERSION --build-number 1
          if ($LASTEXITCODE -ne 0) { throw "Flutter brand overlay failed" }
      - name: Test and compile real Flutter Windows engine
        shell: pwsh
        working-directory: vendor/clubTivi
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "Flutter packages unavailable" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }
          flutter build windows --release --dart-define=IPTV_EDITION=$(($env:EDITION).ToLowerInvariant())
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
      - name: Build real Portable and Setup binaries
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'vendor/clubTivi/build/windows/x64/runner/Release'
          if (!(Test-Path "$payload/iptvplus.exe") -or !(Test-Path "$payload/data")) { throw "Missing full Flutter Windows runner" }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$payload/*" -DestinationPath "tools/portable/flutter-bundle.zip" -CompressionLevel Optimal -Force
          dotnet publish tools/portable/IPTVPlusPortable.csproj -c Release -r win-x64 --self-contained true -o "portable-output" -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw "One-file Portable build failed" }
          if (!(Test-Path "portable-output/IPTVPlusPortable.exe")) { throw "Portable exe absent" }
          Copy-Item "portable-output/IPTVPlusPortable.exe" "release/IPTV-Plus-v$($env:RELEASE_VERSION)-$($env:EDITION)-Portable.exe"
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed" }
          $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { throw "NSIS compiler absent" }
          $output = Join-Path $PWD "release/IPTV-Plus-v$($env:RELEASE_VERSION)-$($env:EDITION)-Setup.exe"
          & $compiler "/DVERSION=$($env:RELEASE_VERSION)" "/DEDITION=$($env:EDITION)" "/DPAYLOAD=$payload" "/DOUTPUT=$output" "tools/windows/iptvplus.nsi"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) { throw "NSIS setup build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-windows-${{ matrix.edition }}
          path: release/*.exe
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Pro]
    env:
      EDITION: ${{ matrix.edition }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      IPTV_ANDROID_KEYSTORE_BASE64: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEYSTORE_BASE64 || secrets.IPTV_PRO_KEYSTORE_BASE64 }}
      IPTV_ANDROID_STORE_PASSWORD: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_STORE_PASSWORD || secrets.IPTV_PRO_STORE_PASSWORD }}
      IPTV_ANDROID_KEY_PASSWORD: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEY_PASSWORD || secrets.IPTV_PRO_KEY_PASSWORD }}
      IPTV_ANDROID_KEY_ALIAS: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEY_ALIAS || secrets.IPTV_PRO_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Prepare Flutter Android and permanent release signing
        shell: bash
        run: |
          edition="$(echo "$EDITION" | tr '[:upper:]' '[:lower:]')"
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          python3 tools/clubtivi/prepare.py --edition "$edition" --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version "$RELEASE_VERSION" --build-number 1
          python3 tools/clubtivi/sign_flutter_android.py
      - name: Build signed Free or Pro APK and AAB
        shell: bash
        working-directory: vendor/clubTivi
        run: |
          edition="$(echo "$EDITION" | tr '[:upper:]' '[:lower:]')"
          flutter pub get
          flutter test
          flutter build apk --release --dart-define=IPTV_EDITION="$edition"
          flutter build appbundle --release --dart-define=IPTV_EDITION="$edition"
      - name: Verify both signatures and collect genuine Android binaries
        shell: bash
        run: |
          mkdir -p release
          apk="vendor/clubTivi/build/app/outputs/flutter-apk/app-release.apk"
          aab="vendor/clubTivi/build/app/outputs/bundle/release/app-release.aab"
          test -s "$apk" && test -s "$aab"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          jarsigner -verify -strict "$aab"
          cp "$apk" "release/IPTV-Plus-v$RELEASE_VERSION-$EDITION.apk"
          cp "$aab" "release/IPTV-Plus-v$RELEASE_VERSION-$EDITION.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-${{ matrix.edition }}
          path: |
            release/*.apk
            release/*.aab
          if-no-files-found: error

  publish:
    needs: [preflight, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iptv-*
          path: release
          merge-multiple: true
      - name: Add all branding, QA manifest and SHA-256
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/release/validate_designs.py
          zip -q -r "release/IPTV-Plus-v$RELEASE_VERSION-Branding.zip" assets/brand assets/previews assets/screens
          python3 scripts/release/notes.py "$RELEASE_VERSION"
          python3 scripts/release/validate_artifacts.py --directory release --version "$RELEASE_VERSION"
      - name: Publish ONLY after all eight Flutter binaries pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "IPTV+ $TAG — Free + Pro Android and Windows" \
            --notes-file "release/RELEASE-NOTES.md"
