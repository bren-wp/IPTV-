name: IPTV+ verified release — Free and Pro, Android and Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Expected app version (must match package.json)
        required: false
        type: string
concurrency:
  group: iptv-plus-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New unique version check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/check_version.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: python3 scripts/release/validate_designs.py

  windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Pro]
    env:
      VITE_IPTV_EDITION: ${{ matrix.edition == 'Free' && 'free' || 'pro' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - name: IPTV+ native icons
        run: npm run tauri -- icon assets/brand/iptv-plus-icon.svg
      - name: Build actual Windows binary and NSIS Setup
        shell: pwsh
        run: |
          $config = "src-tauri/tauri.$($env:VITE_IPTV_EDITION).conf.json"
          npm run tauri -- build --config $config --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
      - name: Collect Portable and Setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          EDITION: ${{ matrix.edition }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = "src-tauri/target/release/iptv-plus.exe"
          if (!(Test-Path $exe)) { throw "Actual Windows application .exe is missing" }
          $setups = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Recurse -Filter "*setup.exe" -File)
          if ($setups.Count -ne 1) { throw "Expected one real NSIS setup, found $($setups.Count)" }
          Copy-Item $exe "release/IPTV-Plus-v$($env:RELEASE_VERSION)-$($env:EDITION)-Portable.exe"
          Copy-Item $setups[0].FullName "release/IPTV-Plus-v$($env:RELEASE_VERSION)-$($env:EDITION)-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-windows-${{ matrix.edition }}
          path: release/*.exe
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Pro]
    env:
      VITE_IPTV_EDITION: ${{ matrix.edition == 'Free' && 'free' || 'pro' }}
      IPTV_ANDROID_KEYSTORE_BASE64: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEYSTORE_BASE64 || secrets.IPTV_PRO_KEYSTORE_BASE64 }}
      IPTV_ANDROID_STORE_PASSWORD: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_STORE_PASSWORD || secrets.IPTV_PRO_STORE_PASSWORD }}
      IPTV_ANDROID_KEY_PASSWORD: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEY_PASSWORD || secrets.IPTV_PRO_KEY_PASSWORD }}
      IPTV_ANDROID_KEY_ALIAS: ${{ matrix.edition == 'Free' && secrets.IPTV_FREE_KEY_ALIAS || secrets.IPTV_PRO_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Init native Android project and embed original brand icons
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          npm run tauri -- android init --ci --config "src-tauri/tauri.$VITE_IPTV_EDITION.conf.json"
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
      - name: Apply persistent Android release signing keys
        run: python3 scripts/release/android_signing.py
      - name: Compile signed APK and AAB
        run: npm run tauri -- android build --apk --aab --ci --config "src-tauri/tauri.$VITE_IPTV_EDITION.conf.json" --target aarch64 armv7 x86_64
      - name: Verify both signed packages
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          EDITION: ${{ matrix.edition }}
        run: |
          python3 scripts/release/collect_android.py "$EDITION" "$RELEASE_VERSION" release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release/IPTV-Plus-v$RELEASE_VERSION-$EDITION.apk"
          jarsigner -verify -strict "release/IPTV-Plus-v$RELEASE_VERSION-$EDITION.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-${{ matrix.edition }}
          path: |
            release/*.apk
            release/*.aab
          if-no-files-found: error

  publish:
    needs: [preflight, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iptv-*
          path: release
          merge-multiple: true
      - name: Add all branding, QA manifest and SHA-256
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/release/validate_designs.py
          zip -q -r "release/IPTV-Plus-v$RELEASE_VERSION-Branding.zip" assets/brand assets/previews assets/screens
          python3 scripts/release/notes.py "$RELEASE_VERSION"
          python3 scripts/release/validate_artifacts.py --directory release --version "$RELEASE_VERSION"
      - name: Publish ONLY after all eight build variants pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "IPTV+ $TAG — Free + Pro Android and Windows" \
            --notes-file "release/RELEASE-NOTES.md"
