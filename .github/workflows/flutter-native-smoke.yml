name: IPTV+ unified Android and Windows native smoke
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:
concurrency:
  group: iptv-flutter-native-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    name: Single Android debug APK and full feature set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Generate single original branded app
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          python3 tools/clubtivi/prepare.py --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version 0.2.0
      - name: Build real Android debug APK after dependency update
        working-directory: vendor/clubTivi
        run: |
          flutter pub upgrade
          flutter test
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
  windows:
    name: Single Windows Flutter Portable and Setup
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Generate original IPTV+ icons and branding
        shell: pwsh
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          if ($LASTEXITCODE -ne 0) { throw "Icon generator failed" }
          python tools/clubtivi/prepare.py --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico --version 0.2.0
          if ($LASTEXITCODE -ne 0) { throw "Branding failed" }
      - name: Build Windows Flutter after dependency refresh
        working-directory: vendor/clubTivi
        shell: pwsh
        run: |
          flutter pub upgrade
          if ($LASTEXITCODE -ne 0) { throw "Dependencies failed" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
      - name: Verify Portable and NSIS Setup generation
        shell: pwsh
        run: |
          $dir=Join-Path $PWD 'vendor/clubTivi/build/windows/x64/runner/Release'
          if (!(Test-Path "$dir/iptvplus.exe") -or !(Test-Path "$dir/data")) { throw "Incomplete Flutter runner" }
          Compress-Archive -Path "$dir/*" -DestinationPath tools/portable/flutter-bundle.zip -CompressionLevel Optimal -Force
          dotnet publish tools/portable/IPTVPlusPortable.csproj -c Release -r win-x64 --self-contained true -o portable-output -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0 -or !(Test-Path portable-output/IPTVPlusPortable.exe)) { throw "Portable failed" }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $compiler='C:\Program Files (x86)\NSIS\makensis.exe'
          $output=Join-Path $PWD 'IPTV-Plus-Test-Setup.exe'
          & $compiler "/DVERSION=0.2.0" "/DPAYLOAD=$dir" "/DOUTPUT=$output" tools/windows/iptvplus.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) { throw "NSIS Setup failed" }
