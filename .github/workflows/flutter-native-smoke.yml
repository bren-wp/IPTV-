name: IPTV+ Flutter native build smoke
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: iptv-flutter-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android native smoke ${{ matrix.edition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [free, pro]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Apply IPTV+ branded Flutter source
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          python3 tools/clubtivi/prepare.py --edition "$EDITION" --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico
      - name: Build Android debug APK (not a signed production release)
        env:
          EDITION: ${{ matrix.edition }}
        working-directory: vendor/clubTivi
        run: |
          flutter pub get
          flutter test
          flutter build apk --debug --dart-define=IPTV_EDITION="$EDITION"
          test -s build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows real Flutter + Portable/Setup smoke ${{ matrix.edition }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Pro]
    env:
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: npm install --no-audit --no-fund
      - name: Apply IPTV+ branding
        shell: pwsh
        run: |
          npm run tauri -- icon assets/brand/iptv-plus-icon.svg
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          python tools/clubtivi/prepare.py --edition $(($env:EDITION).ToLowerInvariant()) --icon-png src-tauri/icons/128x128@2x.png --icon-ico src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "Flutter overlay failed" }
      - name: Build Flutter Windows and test UI
        working-directory: vendor/clubTivi
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "Flutter pub get failed" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }
          flutter build windows --release --dart-define=IPTV_EDITION=$(($env:EDITION).ToLowerInvariant())
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
      - name: Validate executable and one-file bundle creation
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'vendor/clubTivi/build/windows/x64/runner/Release'
          if (!(Test-Path "$dir/iptvplus.exe") -or !(Test-Path "$dir/data")) { throw "Missing Flutter runner or runtime data" }
          Compress-Archive -Path "$dir/*" -DestinationPath tools/portable/flutter-bundle.zip -CompressionLevel Optimal -Force
          dotnet publish tools/portable/IPTVPlusPortable.csproj -c Release -r win-x64 --self-contained true -o portable-output -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw "Portable package failed" }
          if (!(Test-Path portable-output/IPTVPlusPortable.exe)) { throw "Portable exe missing" }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS missing" }
          $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
          $installer = Join-Path $PWD "IPTV-Plus-Test-$($env:EDITION)-Setup.exe"
          & $compiler "/DVERSION=0.1.0" "/DEDITION=$($env:EDITION)" "/DPAYLOAD=$dir" "/DOUTPUT=$installer" "tools/windows/iptvplus.nsi"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $installer)) { throw "NSIS setup packaging failed" }
