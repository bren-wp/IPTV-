name: IPTV+ frontend checks
on:
  push:
    branches: [main, "feat/**"]
concurrency:
  group: iptv-frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: M3U parser tests
        run: npm test
      - name: Verify every screen concept is versioned
        run: python3 scripts/release/validate_designs.py
      - name: Test release signing readiness (no secret values)
        run: python3 -m unittest discover scripts/release -p 'test_*.py'
      - name: Compile Python release scripts
        run: python3 -m compileall -q scripts/release
