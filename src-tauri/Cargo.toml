[package]
name = "iptv-plus"
version = "0.1.0"
description = "IPTV+ regional media player"
authors = ["Brendigo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "iptv_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
